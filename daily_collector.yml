name: Daily Content Collector

on:
  # Change this cron to your desired UTC time.
  # 30 1 * * * = 07:00 AM IST.
  schedule:
    - cron: "30 1 * * *"

  # Allows you to test manually from GitHub:
  # Actions → Daily Content Collector → Run workflow
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-content-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          REQUEST_TIMEOUT_SECONDS: "20"
          MAX_ARTICLES_PER_SOURCE: "10"
          STATE_FILE: "data/state.json"
          LOG_LEVEL: "INFO"
        run: python -m src.main

      - name: Commit updated state
        if: success()
        run: |
          if [ -f data/state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/state.json
            if git diff --cached --quiet; then
              echo "No state changes to commit."
            else
              git commit -m "chore: update collector state [skip ci]"
              git push
            fi
          fi
